<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LAND CRUISER CLINOMETER PRO</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            background-color: #0b0c10;
            color: #fff;
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #15181e 0%, #0b0c10 100%);
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        /* ヘッダー */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(20, 22, 28, 0.9);
            border-bottom: 1px solid #2a2e39;
        }
        .sensor-btn {
            background: #d97706;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(217, 119, 6, 0.4);
        }
        .sensor-btn.active {
            background: #16a34a;
            box-shadow: 0 2px 5px rgba(22, 163, 74, 0.4);
        }
        .settings-btn {
            background: #2a2e39;
            color: #ccc;
            border: 1px solid #3f4656;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
        }
        .gps-info {
            font-size: 11px;
            color: #9ca3af;
            text-align: center;
            padding: 4px;
            background: rgba(0,0,0,0.3);
        }
        /* メインディスプレイ */
        .main-display {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
            overflow-y: auto;
        }
        .clinometer-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            height: 220px;
        }
        .gauge-card {
            background: radial-gradient(circle, #222630 0%, #111318 100%);
            border: 2px solid #2a2e39;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            position: relative;
            overflow: hidden;
        }
        .gauge-title {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #d97706;
        }
        .gauge-value {
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,165,0,0.3);
        }
        .canvas-container {
            width: 100%;
            height: 110px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
        /* 下部メーター群 */
        .bottom-gauges {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            gap: 8px;
            padding: 10px 0;
            align-items: center;
        }
        .sub-card {
            background: #15181e;
            border: 1px solid #2a2e39;
            border-radius: 12px;
            padding: 8px;
            text-align: center;
        }
        .speedometer {
            background: radial-gradient(circle, #1e232d 0%, #0e1015 100%);
            border: 2px solid #d97706;
            border-radius: 50%;
            width: 110px;
            height: 110px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 15px rgba(217, 119, 6, 0.3);
        }
        /* 設定モーダル */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            display: none;
            flex-direction: column;
            padding: 20px;
        }
        .modal.open {
            display: flex;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 5px;
        }
        select, input[type="range"] {
            width: 100%;
            padding: 10px;
            background: #2a2e39;
            border: 1px solid #3f4656;
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
        }
        .manual-control {
            background: #15181e;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #2a2e39;
            margin-top: auto;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- ヘッダー -->
    <div class="header">
        <button class="settings-btn" id="settingsBtn">⚙️</button>
        <button class="sensor-btn" id="sensorBtn">📱 iPhoneセンサー起動</button>
    </div>
    <div class="gps-info" id="gpsInfo">📍 Hirosaki City, Aomori / 緯度: 40.6, 経度: 140.4</div>

    <!-- メインビュー -->
    <div class="main-display">
        <div class="clinometer-row">
            <!-- 左：ピッチ（側面） -->
            <div class="gauge-card">
                <div class="gauge-title">PITCHING (SIDE)</div>
                <div class="canvas-container">
                    <canvas id="pitchCanvas" width="200" height="110"></canvas>
                </div>
                <div class="gauge-value" id="pitchVal">0.0°</div>
            </div>
            <!-- 右：ロール（正面/リヤ） -->
            <div class="gauge-card">
                <div class="gauge-title">ROLLING (FRONT/REAR)</div>
                <div class="canvas-container">
                    <canvas id="rollCanvas" width="200" height="110"></canvas>
                </div>
                <div class="gauge-value" id="rollVal">0.0°</div>
            </div>
        </div>

        <!-- 下部メーター -->
        <div class="bottom-gauges">
            <div class="sub-card">
                <div style="font-size: 10px; color: #9ca3af;">ALTITUDE</div>
                <div style="font-size: 18px; font-weight: bold; color: #d97706;" id="altVal">120 m</div>
            </div>
            <div class="speedometer">
                <div style="font-size: 10px; color: #9ca3af;">VEHICLE SPEED</div>
                <div style="font-size: 22px; font-weight: 900;" id="speedVal">0</div>
                <div style="font-size: 9px; color: #d97706;">km/h</div>
            </div>
            <div class="sub-card">
                <div style="font-size: 10px; color: #9ca3af;">MAX G</div>
                <div style="font-size: 18px; font-weight: bold; color: #d97706;" id="gVal">0.0G</div>
            </div>
        </div>

        <!-- 手動テストシミュレータ -->
        <div class="manual-control">
            <div style="display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 5px;">
                <span>手動シミュレータ (ピッチ)</span>
                <span id="manualPitchText">0°</span>
            </div>
            <input type="range" id="manualPitch" min="-45" max="45" value="0">
        </div>
    </div>

    <!-- 設定モーダル -->
    <div class="modal" id="settingsModal">
        <div class="modal-header">
            <h3>車両 & カラー設定</h3>
            <button class="modal-close" id="closeModal">×</button>
        </div>
        <div class="form-group">
            <label>ランドクルーザー モデル選択</label>
            <select id="modelSelect">
                <option value="LC40">ランドクルーザー 40系 (FJ40)</option>
                <option value="LC60">ランドクルーザー 60系</option>
                <option value="LC70" selected>ランドクルーザー 70系 (再再販/丸目)</option>
                <option value="LC80">ランドクルーザー 80系</option>
                <option value="LC100">ランドクルーザー 100系</option>
                <option value="LC200">ランドクルーザー 200系</option>
                <option value="LC300">ランドクルーザー 300系</option>
            </select>
        </div>
        <div class="form-group">
            <label>純正カラー選択</label>
            <select id="colorSelect">
                <option value="#d4d4d8">ライトベージュ [5E2]</option>
                <option value="#c2b280">ベージュ [4E9]</option>
                <option value="#ffffff">スーパーホワイト [056]</option>
                <option value="#1e3a8a">ダークブルーマイカ</option>
                <option value="#14532d">ダークグリーンマイカ [6T1]</option>
                <option value="#27272a">アティチュードブラックマイカ</option>
            </select>
        </div>
        <button class="sensor-btn" id="zeroBtn" style="width: 100%; margin-top: 20px; background: #3b82f6;">🎯 水平リセット (ゼロ点調整)</button>
    </div>
</div>

<script>
    let pitch = 0, roll = 0;
    let baseBeta = 0, baseGamma = 0;
    let isSensorActive = false;
    let currentModel = 'LC70';
    let carColor = '#d4d4d8';

    const pitchCanvas = document.getElementById('pitchCanvas');
    const rollCanvas = document.getElementById('rollCanvas');
    const pCtx = pitchCanvas.getContext('2d');
    const rCtx = rollCanvas.getContext('2d');

    // モーダル制御
    document.getElementById('settingsBtn').onclick = () => document.getElementById('settingsModal').classList.add('open');
    document.getElementById('closeModal').onclick = () => document.getElementById('settingsModal').classList.remove('open');

    // 車両・カラー変更
    document.getElementById('modelSelect').onchange = (e) => { currentModel = e.target.value; draw(); };
    document.getElementById('colorSelect').onchange = (e) => { carColor = e.target.value; draw(); };

    // 手動スライダー
    document.getElementById('manualPitch').oninput = (e) => {
        if (!isSensorActive) {
            pitch = parseFloat(e.target.value);
            document.getElementById('manualPitchText').innerText = pitch + '°';
            document.getElementById('pitchVal').innerText = pitch.toFixed(1) + '°';
            draw();
        }
    };

    // センサー有効化
    document.getElementById('sensorBtn').onclick = async () => {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
                const response = await DeviceOrientationEvent.requestPermission();
                if (response === 'granted') {
                    activateSensor();
                } else {
                    alert('センサー権限が拒否されました');
                }
            } catch (e) {
                console.error(e);
            }
        } else {
            activateSensor();
        }
    };

    function activateSensor() {
        isSensorActive = true;
        const btn = document.getElementById('sensorBtn');
        btn.innerText = '📱 センサー稼働中';
        btn.classList.add('active');

        window.addEventListener('deviceorientation', (e) => {
            if (e.beta !== null && e.gamma !== null) {
                if (baseBeta === 0 && baseGamma === 0) {
                    baseBeta = e.beta;
                    baseGamma = e.gamma;
                }
                pitch = e.beta - baseBeta;
                roll = e.gamma - baseGamma;

                document.getElementById('pitchVal').innerText = pitch.toFixed(1) + '°';
                document.getElementById('rollVal').innerText = roll.toFixed(1) + '°';
                draw();
            }
        });
    }

    document.getElementById('zeroBtn').onclick = () => {
        baseBeta = window.lastBeta || 0;
        baseGamma = window.lastGamma || 0;
        pitch = 0; roll = 0;
        alert('水平ゼロ点をリセットしました');
    };

    // 描画ロジック
    function draw() {
        // ピッチ描画 (側面)
        pCtx.clearRect(0, 0, pitchCanvas.width, pitchCanvas.height);
        pCtx.save();
        pCtx.translate(pitchCanvas.width / 2, pitchCanvas.height / 2);
        
        // グリッド背景
        pCtx.strokeStyle = 'rgba(217, 119, 6, 0.2)';
        pCtx.lineWidth = 1;
        for(let i=-100; i<=100; i+=25) {
            pCtx.beginPath(); pCtx.moveTo(i, -60); pCtx.lineTo(i, 60); pCtx.stroke();
            pCtx.beginPath(); pCtx.moveTo(-100, i); pCtx.lineTo(100, i); pCtx.stroke();
        }

        pCtx.rotate((pitch * Math.PI) / 180);
        drawCarSide(pCtx, currentModel, carColor);
        pCtx.restore();

        // ロール描画 (正面/リヤ)
        rCtx.clearRect(0, 0, rollCanvas.width, rollCanvas.height);
        rCtx.save();
        rCtx.translate(rollCanvas.width / 2, rollCanvas.height / 2);

        pCtx.strokeStyle = 'rgba(217, 119, 6, 0.2)';
        for(let i=-100; i<=100; i+=25) {
            rCtx.beginPath(); rCtx.moveTo(i, -60); rCtx.lineTo(i, 60); rCtx.stroke();
            rCtx.beginPath(); rCtx.moveTo(-100, i); rCtx.lineTo(100, i); rCtx.stroke();
        }

        rCtx.rotate((roll * Math.PI) / 180);
        drawCarRear(rCtx, currentModel, carColor);
        rCtx.restore();
    }

    function drawCarSide(ctx, model, color) {
        ctx.fillStyle = color;
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;

        if (model === 'LC40') {
            ctx.fillRect(-45, -15, 90, 25);
            ctx.fillRect(-30, -32, 55, 20);
            drawWheel(ctx, -30, 15);
            drawWheel(ctx, 30, 15);
        } else if (model === 'LC70') {
            ctx.fillRect(-55, -18, 110, 28);
            ctx.fillRect(-38, -35, 75, 22);
            drawWheel(ctx, -36, 16);
            drawWheel(ctx, 36, 16);
        } else {
            ctx.fillRect(-60, -18, 120, 26);
            ctx.beginPath();
            ctx.roundRect(-45, -36, 90, 24, [8, 15, 0, 0]);
            ctx.fill();
            drawWheel(ctx, -40, 15);
            drawWheel(ctx, 40, 15);
        }
    }

    function drawCarRear(ctx, model, color) {
        ctx.fillStyle = color;
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;

        ctx.fillRect(-42, -22, 84, 40);
        ctx.fillStyle = '#111';
        ctx.fillRect(-34, -18, 68, 18);

        if(model === 'LC70' || model === 'LC40' || model === 'LC80') {
            ctx.fillStyle = '#222';
            ctx.beginPath();
            ctx.arc(0, 5, 14, 0, Math.PI*2);
            ctx.fill();
            ctx.stroke();
        }
    }

    function drawWheel(ctx, x, y) {
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(x, y, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#888';
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, Math.PI * 2);
        ctx.fill();
    }

    draw();
</script>
</body>
</html>
